<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallora - Free Wallpapers</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #5428ff, #9d4edd);
      color: white;
      padding: 24px 7%;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 64px);
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 28px;
    }

    .search-box {
      max-width: 600px;
      margin: auto;
      display: flex;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    .search-box input {
      flex: 1;
      padding: 16px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .search-box button,
    .upload-button {
      border: none;
      background: #ffca3a;
      color: #171717;
      padding: 0 22px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      width: min(1200px, 90%);
      margin: 40px auto;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      gap: 15px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filters button {
      border: 1px solid #d7dbea;
      background: white;
      border-radius: 20px;
      padding: 9px 16px;
      cursor: pointer;
    }

    .filters button.active,
    .filters button:hover {
      background: #5428ff;
      color: white;
    }

    .wallpaper-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .wallpaper-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(20, 30, 60, 0.08);
    }

    .wallpaper-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 14px;
    }

    .card-info h3 {
      margin-bottom: 6px;
    }

    .card-info p {
      color: #697386;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .download-button {
      display: inline-block;
      background: #5428ff;
      color: white;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 7px;
      font-size: 14px;
    }

    .upload-section {
      margin-top: 60px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(20, 30, 60, 0.08);
    }

    .upload-section h2 {
      margin-bottom: 20px;
    }

    .upload-form {
      display: grid;
      gap: 14px;
      max-width: 600px;
    }

    .upload-form input,
    .upload-form select {
      padding: 13px;
      border: 1px solid #d7dbea;
      border-radius: 8px;
      font-size: 15px;
    }

    .upload-form button {
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #5428ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 60px;
      color: #697386;
    }

    @media (max-width: 600px) {
      nav {
        align-items: flex-start;
        flex-direction: column;
      }

      nav a {
        margin-left: 0;
        margin-right: 12px;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <div class="logo">Wallora</div>

      <div>
        <a href="#wallpapers">Wallpapers</a>
        <a href="#upload">Upload</a>
      </div>
    </nav>

    <section class="hero">
      <h1>Beautiful wallpapers, completely free</h1>
      <p>Download and share high-quality wallpapers for your phone and desktop.</p>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search nature, cars, anime..."
        />
        <button onclick="searchWallpapers()">Search</button>
      </div>
    </section>
  </header>

  <main>
    <section id="wallpapers">
      <div class="section-heading">
        <h2>Explore wallpapers</h2>
        <span id="wallpaperCount"></span>
      </div>

      <div class="filters">
        <button class="active" onclick="filterWallpapers('all', this)">All</button>
        <button onclick="filterWallpapers('nature', this)">Nature</button>
        <button onclick="filterWallpapers('abstract', this)">Abstract</button>
        <button onclick="filterWallpapers('cars', this)">Cars</button>
        <button onclick="filterWallpapers('space', this)">Space</button>
      </div>

      <div class="wallpaper-grid" id="wallpaperGrid"></div>
    </section>

    <section class="upload-section" id="upload">
      <h2>Upload your wallpaper</h2>

      <form class="upload-form" id="uploadForm">
        <input
          type="text"
          id="wallpaperTitle"
          placeholder="Wallpaper title"
          required
        />

        <select id="wallpaperCategory" required>
          <option value="">Choose category</option>
          <option value="nature">Nature</option>
          <option value="abstract">Abstract</option>
          <option value="cars">Cars</option>
          <option value="space">Space</option>
        </select>

        <input
          type="url"
          id="wallpaperUrl"
          placeholder="Image URL"
          required
        />

        <button type="submit">Upload wallpaper</button>
      </form>
    </section>
  </main>

  <footer>
    © 2026 Wallora. Free wallpapers for everyone.
  </footer>

  <script>
    let wallpapers = [
      {
        title: "Mountain Sunrise",
        category: "nature",
        image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
      },
      {
        title: "Purple Abstract",
        category: "abstract",
        image: "https://images.unsplash.com/photo-1557682250-33bd709cbe85"
      },
      {
        title: "Classic Car",
        category: "cars",
        image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70"
      },
      {
        title: "Night Sky",
        category: "space",
        image: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564"
      },
      {
        title: "Green Forest",
        category: "nature",
        image: "https://images.unsplash.com/photo-1448375240586-882707db888b"
      },
      {
        title: "Blue Waves",
        category: "abstract",
        image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
      }
    ];

    const grid = document.getElementById("wallpaperGrid");
    const count = document.getElementById("wallpaperCount");

    function displayWallpapers(items) {
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = "<p>No wallpapers found.</p>";
        count.textContent = "0 wallpapers";
        return;
      }

      items.forEach((wallpaper) => {
        const card = document.createElement("article");
        card.className = "wallpaper-card";

        const imageUrl = wallpaper.image + "?auto=format&fit=crop&w=900&q=85";

        card.innerHTML = `
          <img src="${imageUrl}" alt="${wallpaper.title}" loading="lazy">
          <div class="card-info">
            <h3>${wallpaper.title}</h3>
            <p>${wallpaper.category}</p>
            <a
              class="download-button"
              href="${imageUrl}"
              target="_blank"
              download
            >
              Download
            </a>
          </div>
        `;

        grid.appendChild(card);
      });

      count.textContent = `${items.length} wallpaper${items.length === 1 ? "" : "s"}`;
    }

    function filterWallpapers(category, button) {
      document.querySelectorAll(".filters button").forEach((item) => {
        item.classList.remove("active");
      });

      button.classList.add("active");

      if (category === "all") {
        displayWallpapers(wallpapers);
      } else {
        displayWallpapers(
          wallpapers.filter((wallpaper) => wallpaper.category === category)
        );
      }
    }

    function searchWallpapers() {
      const searchTerm = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

      const results = wallpapers.filter((wallpaper) => {
        return (
          wallpaper.title.toLowerCase().includes(searchTerm) ||
          wallpaper.category.toLowerCase().includes(searchTerm)
        );
      });

      displayWallpapers(results);
    }

    document
      .getElementById("uploadForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        const title = document.getElementById("wallpaperTitle").value;
        const category = document.getElementById("wallpaperCategory").value;
        const image = document.getElementById("wallpaperUrl").value;

        wallpapers.unshift({
          title,
          category,
          image
        });

        displayWallpapers(wallpapers);
        this.reset();

        alert("Wallpaper added successfully!");
      });

    displayWallpapers(wallpapers);
  </script>
</body>
</html>
